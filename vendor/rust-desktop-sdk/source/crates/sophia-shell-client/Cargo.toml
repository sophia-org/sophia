[package]
name = "sophia-shell-client"
description = "Sophia desktop shell client over the sophia_shell_fs_v1 9P file contract."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
experimental-ack-handoff = []
experimental-write-read-scheduling = ["sophia-9p-client/experimental-write-read-scheduling"]

[dependencies]
rustix = { workspace = true, features = ["event", "std"] }
sophia-9p-client = { workspace = true }
sophia-9p-records = { workspace = true }
sophia-shell-protocol = { workspace = true }
sophia-image-producer = { path = "../sophia-image-producer", version = "0.3.0" }

[lints]
workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["net", "fs"] }
