[package]
name = "sophia-isb"
description = "Mapped Immutable Shared Buffer builder: one private writable mapping, sealed on finish."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
rustix = { workspace = true, features = ["fs", "mm", "std"] }

[dev-dependencies]
rustix = { workspace = true, features = ["fs", "mm", "process", "std"] }

# The workspace forbids unsafe code, and a forbid cannot be relaxed inside a
# crate. This crate denies it instead so only its private mapping module may
# opt out. Keep the remaining lints in step with the workspace table.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
new_without_default = "allow"
