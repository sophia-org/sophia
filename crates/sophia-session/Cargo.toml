[package]
name = "sophia-session"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sophia-9p = { path = "../sophia-9p", optional = true }
sophia-backend-live = { path = "../sophia-backend-live", optional = true, default-features = false }
sophia-broker = { path = "../sophia-broker" }
sophia-config = { path = "../sophia-config" }
sophia-engine = { path = "../sophia-engine" }
sophia-input-authority = { path = "../sophia-input-authority" }
sophia-portal = { path = "../sophia-portal" }
sophia-protocol = { path = "../sophia-protocol" }
sophia-runtime = { path = "../sophia-runtime" }
sophia-renderer-live = { path = "../sophia-renderer-live" }
sophia-wm-demo = { path = "../sophia-wm-demo" }
sophia-x-authority = { path = "../sophia-x-authority" }
sophia-xshmfence = { path = "../sophia-xshmfence" }
tracing.workspace = true
sha2.workspace = true
rustix = { version = "1.1", default-features = false, features = ["process", "rand", "system", "fs", "time", "pipe"] }
x11rb = { version = "0.13.1", features = ["xtest"] }

[dev-dependencies]
sophia-backend-live = { path = "../sophia-backend-live", default-features = false, features = ["test-support"] }
sophia-conformance = { path = "../sophia-conformance" }
sophia-shell-client = { path = "../sophia-shell-client" }
sophia-renderer-native-egl = { path = "../sophia-renderer-native-egl", features = ["gbm-platform"] }

[features]
default = []
native-session = [
    "dep:sophia-9p",
    "sophia-backend-live/gbm-probe",
    "sophia-backend-live/libdrm-events",
    "sophia-backend-live/drm-hotplug",
    "sophia-backend-live/libinput-events",
    "sophia-backend-live/seat-control",
]
atomic-scanout-live = ["native-session"]

[lints]
workspace = true
