[package]
name = "sophia-renderer-live"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gbm = { version = "0.18.0", optional = true, default-features = false }
parley = { version = "=0.11.1", default-features = false, features = ["std"] }
rustix.workspace = true
sophia-engine = { path = "../sophia-engine" }
sophia-runtime = { path = "../sophia-runtime" }
sophia-protocol = { path = "../sophia-protocol" }
sophia-renderer-native-egl = { path = "../sophia-renderer-native-egl", optional = true }
sophia-xshmfence = { path = "../sophia-xshmfence" }
vello_cpu = { version = "=0.2.0", default-features = false, features = ["std", "text", "u8_pipeline"] }
xcursor.workspace = true


[features]
default = []
gbm-probe = ["dep:gbm", "dep:sophia-renderer-native-egl", "sophia-renderer-native-egl/gbm-platform"]
egl-probe = ["dep:sophia-renderer-native-egl"]

[[example]]
name = "descriptor_projection_probe"
required-features = ["gbm-probe"]

[lints]
workspace = true
