[package]
name = "sophia-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Opt-in per-thread stage timers for device-free frame attribution; absent from default builds.
diagnostic-frame-cost = ["rustix/time", "rustix/thread"]
experimental-draw = ["dep:sophia-draw", "rustix/fs"]
experimental-shell-capture = ["dep:sophia-renderer-image", "sophia-renderer-image/experimental-shell-capture", "rustix/fs"]
# Opt-in shell-file control-turn observation; absent from default builds.
experimental-custody-dispatch = []
# W2 prototype: a component may negotiate r12 with bit 17 when its owner
# also permits it. Absent from default and release builds.
experimental-shell-retire-on-present = []
# W3 credit lifecycle only; no wire negotiation or Session enablement yet.
experimental-shell-standing-credit = []

[dependencies]
sophia-draw = { path = "../sophia-draw", optional = true }
sophia-renderer-image = { path = "../sophia-renderer-image", optional = true }
sophia-wake = { path = "../sophia-wake" }
rustix = { version = "1.1", default-features = false, features = ["net", "process", "std", "event", "rand"] }
sophia-linux-peer = { path = "../sophia-linux-peer" }
sophia-9p = { path = "../sophia-9p" }
sophia-9p-client = { workspace = true }
sophia-protocol = { path = "../sophia-protocol" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
sophia-linux-peer = { path = "../sophia-linux-peer" }
serde = { version = "1", features = ["derive"] }
sophia-launch-client = { workspace = true }
sophia-namespace-client = { workspace = true }
rustix = { workspace = true, features = ["fs"] }
serde_json = "1"
sha2.workspace = true
sophia-engine = { path = "../sophia-engine" }
sophia-shell-client = { workspace = true }

[lints]
workspace = true

[[example]]
name = "vello_draw_panel"
required-features = ["experimental-draw"]

[[example]]
name = "shell_timing_peer_ring"
