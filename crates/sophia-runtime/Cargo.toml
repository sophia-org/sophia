[package]
name = "sophia-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
experimental-custody-dispatch = []
# Isolated qualification branch only; do not merge the retired IPC comparator.
comparator-counters = ["rustix/time", "dep:nix"]
comparator-allocation-counting = ["comparator-counters", "dep:stats_alloc"]
comparator-cpu-counting = ["comparator-counters"]
comparator-profiling = ["comparator-allocation-counting"]
comparator-request-attribution = ["comparator-profiling", "sophia-9p/comparator-request-attribution"]
comparator-progress = ["comparator-counters", "sophia-9p/comparator-progress"]
comparator-wire-trace = ["sophia-9p/comparator-wire-trace"]
comparator-journal-trace = ["sophia-9p/comparator-journal-trace"]

[dependencies]
stats_alloc = { version = "=0.1.10", optional = true }
nix = { version = "0.30.1", default-features = false, features = ["resource"], optional = true }
sophia-wake = { path = "../sophia-wake" }
rustix = { version = "1.1", default-features = false, features = ["net", "process", "std", "event", "rand"] }
sophia-linux-peer = { path = "../sophia-linux-peer" }
sophia-9p = { path = "../sophia-9p" }
sophia-9p-client = { workspace = true }
sophia-protocol = { path = "../sophia-protocol" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
sophia-namespace-client = { workspace = true }
rustix = { workspace = true, features = ["fs", "time"] }
stats_alloc = "=0.1.10"
serde_json = "1"
sha2.workspace = true
sophia-engine = { path = "../sophia-engine" }
sophia-shell-client = { workspace = true }
sophia-launch-client = { workspace = true }
sophia-image-producer = { path = "../../vendor/rust-desktop-sdk/source/crates/sophia-image-producer" }

[lints]
workspace = true
