[package]
name = "sophia-9p"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
comparator-progress = []
comparator-wire-trace = []
comparator-journal-trace = []
comparator-request-attribution = ["dep:stats_alloc", "rustix/time"]

[dependencies]
stats_alloc = { version = "=0.1.10", optional = true }
rustix = { workspace = true, features = ["event", "net", "pipe", "std"] }
sophia-9p-records = { workspace = true }

[dev-dependencies]
stats_alloc = "=0.1.10"
# Sophia's own clients, tested here against this server core.
sophia-9p-client = { workspace = true }

[lints]
workspace = true
