[package]
name = "sophia-engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rustix = { workspace = true, features = ["net", "std"] }
sha2.workspace = true
sophia-portal = { path = "../sophia-portal" }
sophia-protocol = { path = "../sophia-protocol" }
sophia-runtime = { path = "../sophia-runtime" }
tracing.workspace = true

xkbcommon = "0.8"

[features]
default = []
# A candidate shell image placed by its admitted description alone (n7fj3c2p, G3-3).
experimental-combined-frame-job = ["sophia-runtime/experimental-combined-frame-job"]

[lints]
workspace = true

[dev-dependencies]
sophia-linux-peer = { path = "../sophia-linux-peer" }
stats_alloc = "=0.1.10"
