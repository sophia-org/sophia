[workspace]
members = [
    "crates/sophia-conformance",
    "crates/sophia-cli",
    "crates/sophia-backend-live",
    "crates/sophia-broker",
    "crates/sophia-config",
    "crates/sophia-drm-out-fence",
    "crates/sophia-engine",
    "crates/sophia-input-authority",
    "crates/sophia-linux-peer",
    "crates/sophia-portal",
    "crates/sophia-protocol",
    "crates/sophia-renderer-native-egl",
    "crates/sophia-renderer-live",
    "crates/sophia-runtime",
    "crates/sophia-session",
    "crates/sophia-sysv-shm",
    "crates/sophia-9p",
    "crates/sophia-9p-authority",
    "crates/sophia-wm-demo",
    "crates/sophia-x-authority",
    "crates/sophia-xshmfence",
    "tools/sophia-policy-protocol-gen",
    "crates/xtask",
]
default-members = [
    "crates/sophia-cli",
    "crates/sophia-backend-live",
    "crates/sophia-broker",
    "crates/sophia-config",
    "crates/sophia-drm-out-fence",
    "crates/sophia-engine",
    "crates/sophia-portal",
    "crates/sophia-protocol",
    "crates/sophia-renderer-native-egl",
    "crates/sophia-renderer-live",
    "crates/sophia-runtime",
    "crates/sophia-session",
    "crates/sophia-sysv-shm",
    "crates/sophia-9p",
    "crates/sophia-9p-authority",
    "crates/sophia-wm-demo",
    "crates/sophia-x-authority",
    "crates/sophia-xshmfence",
]
resolver = "3"
# The Rust desktop SDK snapshot is its own workspace; Sophia uses its crates
# through the path dependencies below.
exclude = ["vendor/rust-desktop-sdk/source"]

[workspace.package]
authors = ["Mason Austin Green"]
edition = "2024"
license = "BSD-3-Clause"
version = "0.1.0"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
new_without_default = "allow"

[profile.dev]
# Backtraces keep file and line; only debugger variable inspection is given up.
# Measured on a workspace test binary: 479 MB at debuginfo=2, 99 MB stripped,
# with debug sections accounting for 379 MB of the file. The `test` profile
# inherits this, so every test binary in the workspace is covered.
debug = "line-tables-only"

[workspace.dependencies]
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
# Pure-Rust inflate for the X authority's compressed font files. Chosen over
# flate2 because it pulls in no C library and no build script.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
rustix = { version = "1.1", default-features = false, features = ["fs", "process"] }
# The Rust desktop SDK, vendored from sophia-org/sophia-desktop-sdk-rs; the pin
# and digests are in vendor/rust-desktop-sdk/manifest.json (cargo xtask check
# rust-desktop-sdk).
sophia-9p-client = { path = "vendor/rust-desktop-sdk/source/crates/sophia-9p-client" }
sophia-9p-records = { path = "vendor/rust-desktop-sdk/source/crates/sophia-9p-records" }
sophia-desktop-ids = { path = "vendor/rust-desktop-sdk/source/crates/sophia-desktop-ids" }
sophia-shell-client = { path = "vendor/rust-desktop-sdk/source/crates/sophia-shell-client" }
sophia-shell-ipc = { path = "vendor/rust-desktop-sdk/source/crates/sophia-shell-ipc" }
sophia-shell-protocol = { path = "vendor/rust-desktop-sdk/source/crates/sophia-shell-protocol" }
sha2 = "0.10.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
xcursor = "0.3.10"
